apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: golden-path-service
  title: Golden Path Service
  description: Create a production-ready Angular + Spring Boot + PostgreSQL service with automated CI/CD, Governance, and PagerDuty On-Call
  tags:
    - recommended
    - angular
    - spring-boot
    - postgresql
    - kubernetes

spec:
  owner: group:default/guests
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the service (lowercase alphanumeric with dashes)
          pattern: '^[a-z0-9-]+$'

        description:
          title: Description
          type: string
          description: Short description of the service

  steps:
    - id: create-pagerduty-service
      name: Provision PagerDuty On-Call Service (Automated Platform Policy)
      action: http:backstage:request
      continueOnError: true
      input:
        method: POST
        path: /proxy/pagerduty/services
        headers:
          content-type: application/json
          accept: application/vnd.pagerduty+json;version=2
        body:
          service:
            name: ${{ parameters.name }}
            description: On-call escalation service for ${{ parameters.name }} (Golden Path IDP)
            auto_resolve_timeout: 14400
            acknowledgement_timeout: 1800
            status: active
            escalation_policy:
              id: PHDR94V
              type: escalation_policy_reference
            alert_creation: create_alerts_and_incidents

    - id: fetch
      name: Fetch Golden Path Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          githubOwner: FatmaMejri1
          pagerdutyServiceId: ${{ steps['create-pagerduty-service'].output.body.service.id | default("PCIJWYX") }}

    - id: publish
      name: Publish GitHub Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=FatmaMejri1&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: set-ghcr-secret
      name: Inject GHCR Publishing Secret (Platform Policy)
      action: github:repo:set-secret
      continueOnError: true
      input:
        repoOwner: FatmaMejri1
        repoName: ${{ parameters.name }}
        secretName: GHCR_PAT

    - id: set-workflow-permissions
      name: Configure GitHub Actions Workflow Permissions (Automated Platform Policy)
      action: http:backstage:request
      continueOnError: true
      input:
        method: PUT
        path: /proxy/github/api/repos/FatmaMejri1/${{ parameters.name }}/actions/permissions/workflow
        headers:
          content-type: application/json
        body:
          default_workflow_permissions: write
          can_approve_pull_request_reviews: true

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
