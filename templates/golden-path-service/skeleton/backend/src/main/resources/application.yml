server:
  port: 8081

spring:
  application:
    name: ${{ values.name }}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/${{ values.name }}}
    username: ${DATABASE_USERNAME:${{ values.name }}}
    password: ${DATABASE_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${{ values.name }}
