apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: golden-path-ai-service
  title: AI Microservice (FastAPI + Gemini)
  description: Create a production-ready Python FastAPI AI microservice with Gemini LLM integration, Prometheus metrics, DevSecOps CI/CD, and Helm charts
  tags:
    - recommended
    - python
    - fastapi
    - gemini
    - ai
    - kubernetes

spec:
  owner: group:default/guests
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the microservice (lowercase alphanumeric with dashes, e.g. ai-copilot)
          pattern: '^[a-z0-9-]+$'

        description:
          title: Description
          type: string
          description: Short description of the AI microservice

  steps:
    - id: fetch
      name: Fetch AI Microservice Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          githubOwner: FatmaMejri1

    - id: publish
      name: Publish GitHub Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=FatmaMejri1&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: set-workflow-permissions
      name: Configure GitHub Actions Workflow Permissions (Automated Platform Policy)
      action: http:backstage:request
      input:
        continueOnBadResponse: true
        method: PUT
        path: /proxy/github/api/repos/FatmaMejri1/${{ parameters.name }}/actions/permissions/workflow
        headers:
          content-type: application/json
        body:
          default_workflow_permissions: write
          can_approve_pull_request_reviews: true

    - id: register
      name: Register Component in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
