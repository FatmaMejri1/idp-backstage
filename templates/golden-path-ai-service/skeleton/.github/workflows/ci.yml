name: {{ values.name }} CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/{{ values.name }}/**'
      - '.github/workflows/{{ values.name }}-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/{{ values.name }}/**'
      - '.github/workflows/{{ values.name }}-ci.yml'

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          {% raw %}GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}{% endraw %}

  sast-scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep && semgrep scan --config auto --severity ERROR --exclude='*.test.py' --exclude=Dockerfile apps/{{ values.name }}/app/

  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: apps/{{ values.name }}
        run: |
          pip install -r app/requirements.txt
          python3 -m py_compile app/main.py

  build-scan:
    name: Build & Trivy Scan
    needs: [secret-scan, sast-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t {{ values.name }}-local-test apps/{{ values.name }}/app
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: {{ values.name }}-local-test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          trivyignores: app/.trivyignore

  publish:
    name: Publish Image -> GHCR
    needs: [build-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          {% raw %}username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}{% endraw %}
      - name: Push image
        run: |
          {% raw %}OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"{% endraw %}
          IMAGE="ghcr.io/${OWNER}/{{ values.name }}"
          docker build -t $IMAGE:latest apps/{{ values.name }}/app
          docker push $IMAGE:latest