name: CRM Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/crm-backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-backend

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        working-directory: apps/crm/crm-backend
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=p/security-audit --config=p/owasp-top-ten --config=p/java . --severity ERROR

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crmdb
          POSTGRES_USER: crmuser
          POSTGRES_PASSWORD: crmpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        working-directory: apps/crm/crm-backend
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crmdb
          SPRING_DATASOURCE_USERNAME: crmuser
          SPRING_DATASOURCE_PASSWORD: crmpassword

  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-backend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy scan (table, blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
