name: CRM Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/crm-backend/**'
      - '.github/workflows/backend-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-backend

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY — SECRET SCANNING
  # ============================================================

  secret-scan:
    name: 🔐 Secret Scan — Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SECURITY — SAST
  # ============================================================

  sast-scan:
    name: 🛡️ SAST — Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Run Semgrep security analysis
        working-directory: apps/crm/crm-backend
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/java \
            --severity ERROR \
            .
            

  # ============================================================
  # 3. QUALITY — BUILD & TEST
  # ============================================================

  test:
    name: 🧪 Build & Test — Java 17
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: crmdb
          POSTGRES_USER: crmuser
          POSTGRES_PASSWORD: crmpassword

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        working-directory: apps/crm/crm-backend
        run: mvn test -B

        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/crmdb
          SPRING_DATASOURCE_USERNAME: crmuser
          SPRING_DATASOURCE_PASSWORD: crmpassword


  # ============================================================
  # 4. CONTAINER — BUILD & SECURITY SCAN
  # ============================================================

  build-scan:
    name: 🐳 Build & 🔍 Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-backend
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'


  # ============================================================
  # 5. PUBLISH — GHCR
  # ============================================================

  publish:
    name: 📦 Publish Image → GHCR
    runs-on: ubuntu-latest

    needs:
      - build-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}