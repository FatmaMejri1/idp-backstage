name: CRM Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/crm-frontend/**'
      - '.github/workflows/frontend-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-frontend

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY — SECRET SCANNING
  # ============================================================

  secret-scan:
    name: 🔐 Secret Scan — Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SECURITY — SAST
  # ============================================================

  sast-scan:
    name: 🛡️ SAST — Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install semgrep

      - name: Run Semgrep security analysis
        working-directory: apps/crm/crm-frontend
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --severity ERROR \
            .


  # ============================================================
  # 3. QUALITY — BUILD & TEST
  # ============================================================

  test:
    name: 🧪 Build & Test — Angular 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/crm/crm-frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/crm/crm-frontend
        run: npm ci

      - name: Run Angular tests
        working-directory: apps/crm/crm-frontend
        run: npx ng test --watch=false

      - name: Build Angular application
        working-directory: apps/crm/crm-frontend
        run: npm run build


  # ============================================================
  # 4. CONTAINER — BUILD & SECURITY SCAN
  # ============================================================

  build-scan:
    name: 🐳 Build & 🔍 Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-frontend
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'


  # ============================================================
  # 5. PUBLISH — GHCR
  # ============================================================

  publish:
    name: 📦 Publish Image → GHCR
    runs-on: ubuntu-latest

    needs:
      - build-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}