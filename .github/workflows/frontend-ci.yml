name: CRM Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/crm-frontend/**'
      - '.github/workflows/frontend-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-frontend

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/crm/crm-frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/crm/crm-frontend
        run: npm ci

      - name: Run tests
        working-directory: apps/crm/crm-frontend
        run: npx ng test --watch=false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
