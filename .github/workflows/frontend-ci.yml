name: CRM Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/crm-frontend/**'
      - '.github/workflows/frontend-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-frontend

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        working-directory: apps/crm/crm-frontend
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=p/security-audit --config=p/owasp-top-ten --config=p/typescript . --severity ERROR

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/crm/crm-frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/crm/crm-frontend
        run: npm ci
      - name: Run tests
        working-directory: apps/crm/crm-frontend
        run: npx ng test --watch=false

  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-frontend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy scan (table, blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy scan (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (only if scan passed)
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/crm-frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
