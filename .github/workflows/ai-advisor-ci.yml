name: CRM AI Advisor CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/ai-advisor/**'
      - '.github/workflows/ai-advisor-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-ai-advisor

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECURITY
  # ============================================================

  secret-scan:
    name:  Secret Scan — Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SECURITY: SAST (Semgrep)
  # ============================================================

  sast-scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for SAST Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep SAST Tool
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep SAST Rules (Python & Security Audit)
        working-directory: apps/crm/ai-advisor/app
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/python \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude='*.test.py' \
            .

  # ============================================================
  # 3. QUALITY
  # ============================================================

  quality:
    name:  Lint & Test
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/crm/ai-advisor/app/requirements.txt

      - name: Install dependencies
        working-directory: apps/crm/ai-advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate Python compilation
        working-directory: apps/crm/ai-advisor
        run: |
          python -m py_compile app/main.py


  # ============================================================
  # 3. BUILD + CONTAINER SECURITY (BLOCKING)
  # ============================================================

  build:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - quality

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/ai-advisor
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: apps/crm/ai-advisor/.trivyignore


  # ============================================================
  # 4. PUBLISH (only runs if build succeeded, i.e. Trivy passed)
  # ============================================================

  publish:
    name: Publish Image → GHCR
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/ai-advisor
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate image metadata
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}" > image-info.txt
          echo "Commit: ${{ github.sha }}" >> image-info.txt
          echo "Branch: ${{ github.ref_name }}" >> image-info.txt
          echo "Published: $(date -u)" >> image-info.txt

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-advisor-image-info
          path: image-info.txt

  # ============================================================
  # 5. OBSERVABILITY: Platform Engineering Summary
  # ============================================================

  pipeline-summary:
    name: Platform Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [secret-scan, sast-scan, quality, build, publish]
    steps:
      - name: Generate Workflow Summary
        run: |
          GHCR_STATUS="FAILED"
          if [ "${{ needs.publish.result }}" = "success" ]; then
            GHCR_STATUS="PUBLISHED"
          elif [ "${{ needs.publish.result }}" = "skipped" ]; then
            GHCR_STATUS="SKIPPED"
          fi

          echo "## CRM AI Advisor Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Scan | ${{ needs.sast-scan.result == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Test | ${{ needs.quality.result == 'success' && 'PASSED' || 'FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Build | ${{ needs.build.result == 'success' && 'PASSED' || (needs.build.result == 'skipped' && 'BLOCKED' || 'FAILED') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR Publish | ${GHCR_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY