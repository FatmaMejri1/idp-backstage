name: CRM AI Advisor CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/crm/ai-advisor/**'
      - '.github/workflows/ai-advisor-ci.yml'

env:
  IMAGE_NAME: ghcr.io/fatmamejri1/crm-ai-advisor

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/crm/ai-advisor/app/requirements.txt
      - name: Install dependencies
        working-directory: apps/crm/ai-advisor
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Validate code compilation
        working-directory: apps/crm/ai-advisor
        run: python -m py_compile app/main.py

  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local only)
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/ai-advisor
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: apps/crm/ai-advisor
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}