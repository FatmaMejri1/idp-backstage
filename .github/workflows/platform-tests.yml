name: Platform requirement tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  requirement-tests:
    name: BF / BNF contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run platform tests
        run: python3 -m unittest discover -s tests -v
