apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/FatmaMejri1/idp-backstage.git'
    targetRevision: main
    path: apps/crm/crm-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
