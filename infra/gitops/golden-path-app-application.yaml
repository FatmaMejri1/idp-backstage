apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-app-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/FatmaMejri1/golden-path-app.git'
    targetRevision: main
    path: deploy/helm
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
