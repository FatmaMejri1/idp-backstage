name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep && semgrep scan --config auto --severity ERROR --exclude='*.test.py' --exclude=Dockerfile app/

  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install & Syntax check
        run: |
          pip install -r app/requirements.txt
          python3 -m py_compile app/main.py

  build-scan:
    name: Build & Trivy Scan
    needs: [secret-scan, sast-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Image
        run: |
          docker build -t ai-service-local:${{ github.sha }} app
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-service-local:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          trivyignores: app/.trivyignore
      - name: Save Image Artifact
        run: |
          mkdir -p /tmp/docker-image
          docker save "ai-service-local:${{ github.sha }}" -o /tmp/docker-image/ai-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ai-service-image
          path: /tmp/docker-image/ai-image.tar
          retention-days: 1

  publish:
    name: Publish Image -> GHCR
    needs: [build-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Verified Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-service-image
          path: /tmp/docker-image
      - name: Load Image
        run: docker load -i /tmp/docker-image/ai-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Tag and Push to GHCR
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${{ github.sha }}"
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          docker tag "ai-service-local:${SHA_TAG}" "${IMAGE}:${SHA_TAG}"
          docker tag "ai-service-local:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Published ${IMAGE}:${SHA_TAG} and ${IMAGE}:latest"
