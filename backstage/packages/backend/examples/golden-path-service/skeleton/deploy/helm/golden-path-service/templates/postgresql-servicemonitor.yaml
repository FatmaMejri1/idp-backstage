{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled .Values.postgres.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-postgres
  namespace: default
  labels:
    {{- include "golden-path-service.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}-postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
