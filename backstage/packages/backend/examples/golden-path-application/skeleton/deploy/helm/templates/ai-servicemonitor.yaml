{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled .Values.aiService.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.name }}-ai-service
  namespace: default
  labels:
    {{- include "golden-path-application.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}-ai-service
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
