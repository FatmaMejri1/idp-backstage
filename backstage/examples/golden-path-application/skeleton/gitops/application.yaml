apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/${{ values.githubOwner }}/${{ values.name }}.git'
    targetRevision: HEAD
    path: deploy/helm
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
