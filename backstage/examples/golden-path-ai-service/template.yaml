apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: golden-path-ai-service
  title: AI Microservice (FastAPI + Gemini)
  description: Create a production-ready Python FastAPI AI microservice with Gemini LLM integration, Prometheus metrics, DevSecOps CI/CD, and Helm charts
  tags:
    - recommended
    - python
    - fastapi
    - gemini
    - ai
    - kubernetes

spec:
  owner: group:default/guests
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - description
      properties:
        name:
          title: Service Name
          type: string
          description: Name of the microservice (lowercase alphanumeric with dashes, e.g. ai-copilot)
          pattern: '^[a-z0-9-]+$'

        description:
          title: Description
          type: string
          description: Short description of the AI microservice

  steps:
    - id: create-pagerduty-service
      name: Provision PagerDuty On-Call Service (Automated Platform Policy)
      action: http:backstage:request
      input:
        continueOnBadResponse: true
        method: POST
        path: /proxy/pagerduty/services
        headers:
          content-type: application/json
          accept: application/vnd.pagerduty+json;version=2
        body:
          service:
            name: ${{ parameters.name }}
            description: On-call escalation service for ${{ parameters.name }} (Golden Path AI Service)
            auto_resolve_timeout: 14400
            acknowledgement_timeout: 1800
            status: active
            escalation_policy:
              id: PHDR94V
              type: escalation_policy_reference
            alert_creation: create_alerts_and_incidents

    - id: fetch
      name: Fetch AI Microservice Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          githubOwner: FatmaMejri1
          pagerdutyServiceId: ${{ steps['create-pagerduty-service'].output.body.service.id | default("PGAI001") }}

    - id: publish
      name: Publish GitHub Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=FatmaMejri1&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: set-ghcr-secret
      name: Inject GHCR Access Secret (Automated Platform Policy)
      action: github:repo:set-secret
      input:
        repoOwner: FatmaMejri1
        repoName: ${{ parameters.name }}
        secretName: GHCR_PAT

    - id: set-workflow-permissions
      name: Configure GitHub Actions Workflow Permissions (Automated Platform Policy)
      action: http:backstage:request
      input:
        continueOnBadResponse: true
        method: PUT
        path: /proxy/github/api/repos/FatmaMejri1/${{ parameters.name }}/actions/permissions/workflow
        headers:
          content-type: application/json
        body:
          default_workflow_permissions: write
          can_approve_pull_request_reviews: true

    - id: register
      name: Register Component in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}

      - title: Open in Catalog
        icon: catalog
        entityRef: component:default/${{ parameters.name }}
