apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  labels:
    {{- include "crm.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: crm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-frontend
                port:
                  number: {{ .Values.frontend.port }}
