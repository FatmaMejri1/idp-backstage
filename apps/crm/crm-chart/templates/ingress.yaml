apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  labels:
    {{- include "crm.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx

  rules:
    - host: crm.local
      http:
        paths:
          # CRM REST API
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: crm-backend
                port:
                  number: {{ .Values.backend.port }}

          {{- if .Values.aiAdvisor.enabled }}
          # AI Advisor API
          - path: /ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: crm-ai-advisor
                port:
                  number: {{ .Values.aiAdvisor.port }}
          {{- end }}

          # Angular frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crm-frontend
                port:
                  number: {{ .Values.frontend.port }}