apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crm-frontend
  namespace: default
  labels:
    {{- include "crm.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      app: crm-frontend
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
