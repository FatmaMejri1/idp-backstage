apiVersion: v1
kind: Service
metadata:
  name: crm-frontend
  labels:
    {{- include "crm.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: crm-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      nodePort: {{ .Values.frontend.nodePort }}
