apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord-relay
  namespace: monitoring
  labels:
    app: alertmanager-discord-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-discord-relay
  template:
    metadata:
      labels:
        app: alertmanager-discord-relay
    spec:
      containers:
        - name: relay
          image: benjojo/alertmanager-discord:latest
          ports:
            - containerPort: 9094
          env:
            - name: DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord
                  key: webhook-url-raw
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-discord-relay
  namespace: monitoring
spec:
  selector:
    app: alertmanager-discord-relay
  ports:
    - port: 9094
      targetPort: 9094
