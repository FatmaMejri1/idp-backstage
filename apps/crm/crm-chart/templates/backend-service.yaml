apiVersion: v1
kind: Service
metadata:
  name: crm-backend
  labels:
    {{- include "crm.labels" . | nindent 4 }}
    app: crm-backend
spec:
  type: ClusterIP
  selector:
    app: crm-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
