---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: crm-system
  title: CRM Platform System
  description: Core customer management ecosystem comprising web frontend, microservices backend, and persistence layer.
  tags:
    - crm
    - enterprise
    - production
spec:
  owner: user:guest

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: crm-database
  title: CRM PostgreSQL Database
  description: High-availability relational database storing customer records, transactions, and audit logs.
  tags:
    - postgresql
    - relational
    - stateful
  links:
    - url: http://localhost:3300/d/crm-postgres-dashboard/crm-database-postgresql
      title: PostgreSQL Metrics Dashboard
      icon: dashboard
spec:
  type: database
  lifecycle: production
  owner: user:guest
  system: crm-system

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: crm-api
  title: CRM REST API
  description: OpenAPI 3.0 REST API definition for customer operations, balance inquiries, and CRM transactions.
  tags:
    - openapi
    - rest
    - spring-boot
spec:
  type: openapi
  lifecycle: production
  owner: user:guest
  system: crm-system
  definition: |
    openapi: 3.0.3
    info:
      title: CRM REST API
      version: 1.0.0
      description: Customer management API exposed by the Spring Boot backend.
    servers:
      - url: http://localhost/api
        description: Local Ingress Gateway
      - url: http://crm.local/api
        description: Production Ingress Host
    paths:
      /customers:
        get:
          summary: List all customers
          description: Retrieve paginated list of registered customers.
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
        post:
          summary: Create a new customer
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CustomerInput'
          responses:
            '201':
              description: Customer created successfully
      /customers/{id}:
        get:
          summary: Get customer by ID
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
          responses:
            '200':
              description: Customer found
            '404':
              description: Customer not found
    components:
      schemas:
        Customer:
          type: object
          properties:
            id:
              type: integer
              example: 1
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Doe
            email:
              type: string
              example: jane.doe@example.com
            status:
              type: string
              example: ACTIVE
        CustomerInput:
          type: object
          required:
            - firstName
            - lastName
            - email
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crm
  title: CRM
  description: Customer Relationship Management (CRM) platform reference application.
  tags:
    - spring-boot
    - angular
    - postgresql
    - kubernetes
    - gitops
  links:
    - url: http://localhost:3300/explore?schemaVersion=1&panes=%7B%22a%22:%7B%22datasource%22:%22efw265rn227eof%22,%22queries%22:%5B%7B%22refId%22:%22A%22,%22expr%22:%22%7Bnamespace%3D%5C%22default%5C%22%7D%22,%22queryType%22:%22range%22%7D%5D%7D%7D
      title: Loki Log Explorer
      icon: dashboard
    - url: http://localhost:8080/applications/crm-app
      title: ArgoCD GitOps
      icon: cloud
    - url: http://localhost:3300/dashboards
      title: All Grafana Dashboards
      icon: dashboard
    - url: http://crm.local
      title: CRM Live App
      icon: web
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=crm'
    backstage.io/kubernetes-namespace: default
    github.com/project-slug: FatmaMejri1/idp-backstage
    grafana/dashboard-selector: 'crm'
    grafana/alert-label-selector: 'app=crm'
    pagerduty.com/service-id: PCIJWYX
spec:
  type: service
  lifecycle: production
  owner: user:guest
  system: crm-system
  providesApis:
    - crm-api
  dependsOn:
    - resource:default/crm-database
