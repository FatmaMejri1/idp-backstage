---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: crm-api
  title: CRM REST API
  description: REST API for CRM clients, contacts, and sales opportunities exposed by the Spring Boot backend.
  tags:
    - openapi
    - rest
    - spring-boot
spec:
  type: openapi
  lifecycle: production
  owner: user:guest
  system: crm-system

  definition: |
    openapi: 3.0.3

    info:
      title: CRM REST API
      version: 1.0.0
      description: REST API exposed by the CRM Spring Boot backend for managing clients, contacts, and opportunities.

    servers:
      - url: http://crm.local/api
        description: CRM API through Kubernetes Ingress

    tags:
      - name: Clients
        description: Client management operations
      - name: Contacts
        description: Contact management operations
      - name: Opportunities
        description: Sales opportunity management operations

    paths:

      /clients:
        get:
          tags:
            - Clients
          summary: List all clients
          description: Retrieve all clients.
          operationId: getAllClients
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'

        post:
          tags:
            - Clients
          summary: Create a client
          description: Create a new client.
          operationId: createClient
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClientInput'
          responses:
            '200':
              description: Client created successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Client'

      /clients/{id}:
        parameters:
          - name: id
            in: path
            required: true
            description: Client identifier
            schema:
              type: integer
              format: int64

        get:
          tags:
            - Clients
          summary: Get client by ID
          description: Retrieve a client using its identifier.
          operationId: getClientById
          responses:
            '200':
              description: Client found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Client'
            '404':
              description: Client not found

        put:
          tags:
            - Clients
          summary: Update client
          description: Update an existing client.
          operationId: updateClient
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClientInput'
          responses:
            '200':
              description: Client updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Client'

        delete:
          tags:
            - Clients
          summary: Delete client
          description: Delete an existing client.
          operationId: deleteClient
          responses:
            '204':
              description: Client deleted successfully

      /contacts:
        get:
          tags:
            - Contacts
          summary: List all contacts
          description: Retrieve all contacts.
          operationId: getAllContacts
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'

        post:
          tags:
            - Contacts
          summary: Create a contact
          description: Create a new contact.
          operationId: createContact
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContactInput'
          responses:
            '200':
              description: Contact created successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Contact'

      /contacts/{id}:
        parameters:
          - name: id
            in: path
            required: true
            description: Contact identifier
            schema:
              type: integer
              format: int64

        get:
          tags:
            - Contacts
          summary: Get contact by ID
          description: Retrieve a contact using its identifier.
          operationId: getContactById
          responses:
            '200':
              description: Contact found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Contact'

        put:
          tags:
            - Contacts
          summary: Update contact
          description: Update an existing contact.
          operationId: updateContact
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContactInput'
          responses:
            '200':
              description: Contact updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Contact'

        delete:
          tags:
            - Contacts
          summary: Delete contact
          description: Delete an existing contact.
          operationId: deleteContact
          responses:
            '200':
              description: Contact deleted successfully

      /opportunites:
        get:
          tags:
            - Opportunities
          summary: List all opportunities
          description: Retrieve all sales opportunities.
          operationId: getAllOpportunites
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunite'

        post:
          tags:
            - Opportunities
          summary: Create an opportunity
          description: Create a new sales opportunity.
          operationId: createOpportunite
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpportuniteInput'
          responses:
            '200':
              description: Opportunity created successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Opportunite'

      /opportunites/{id}:
        parameters:
          - name: id
            in: path
            required: true
            description: Opportunity identifier
            schema:
              type: integer
              format: int64

        get:
          tags:
            - Opportunities
          summary: Get opportunity by ID
          description: Retrieve a sales opportunity using its identifier.
          operationId: getOpportuniteById
          responses:
            '200':
              description: Opportunity found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Opportunite'

        put:
          tags:
            - Opportunities
          summary: Update opportunity
          description: Update an existing sales opportunity.
          operationId: updateOpportunite
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpportuniteInput'
          responses:
            '200':
              description: Opportunity updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Opportunite'

        delete:
          tags:
            - Opportunities
          summary: Delete opportunity
          description: Delete an existing sales opportunity.
          operationId: deleteOpportunite
          responses:
            '200':
              description: Opportunity deleted successfully

    components:
      schemas:

        Client:
          type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 1
            name:
              type: string
              example: Acme Corporation
            phone:
              type: string
              example: "+216 71 123 456"
            company:
              type: string
              example: Acme Corporation

        ClientInput:
          type: object
          required:
            - name
            - phone
            - company
          properties:
            name:
              type: string
              example: Acme Corporation
            phone:
              type: string
              example: "+216 71 123 456"
            company:
              type: string
              example: Acme Corporation

        Contact:
          type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 1
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Doe
            email:
              type: string
              format: email
              example: jane.doe@example.com
            phone:
              type: string
              example: "+216 20 123 456"
            client:
              $ref: '#/components/schemas/Client'

        ContactInput:
          type: object
          required:
            - firstName
            - lastName
            - email
          properties:
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Doe
            email:
              type: string
              format: email
              example: jane.doe@example.com
            phone:
              type: string
              example: "+216 20 123 456"
            client:
              $ref: '#/components/schemas/Client'

        Opportunite:
          type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 1
            titre:
              type: string
              example: Enterprise CRM Contract
            montant:
              type: number
              format: double
              example: 25000.00
            statut:
              type: string
              enum:
                - PROSPECTION
                - NEGOCIATION
                - GAGNEE
                - PERDUE
              example: PROSPECTION
            client:
              $ref: '#/components/schemas/Client'

        OpportuniteInput:
          type: object
          required:
            - titre
            - montant
            - statut
          properties:
            titre:
              type: string
              example: Enterprise CRM Contract
            montant:
              type: number
              format: double
              example: 25000.00
            statut:
              type: string
              enum:
                - PROSPECTION
                - NEGOCIATION
                - GAGNEE
                - PERDUE
              example: PROSPECTION
            client:
              $ref: '#/components/schemas/Client'

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: crm
  title: CRM
  description: Customer Relationship Management (CRM) platform reference application.
  tags:
    - spring-boot
    - angular
    - postgresql
    - kubernetes
    - gitops
  links:
    - url: http://localhost:3300/explore?schemaVersion=1&panes=%7B%22a%22:%7B%22datasource%22:%22efw265rn227eof%22,%22queries%22:%5B%7B%22refId%22:%22A%22,%22expr%22:%22%7Bnamespace%3D%5C%22default%5C%22%7D%22,%22queryType%22:%22range%22%7D%5D%7D%7D
      title: Loki Log Explorer
      icon: dashboard

    - url: http://localhost:8080/applications/crm-app
      title: ArgoCD GitOps
      icon: cloud

    - url: http://localhost:3300/dashboards
      title: All Grafana Dashboards
      icon: dashboard

    - url: http://crm.local
      title: CRM Live App
      icon: web

  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=crm'
    backstage.io/kubernetes-namespace: default
    github.com/project-slug: FatmaMejri1/idp-backstage
    grafana/dashboard-selector: 'crm'
    grafana/alert-label-selector: 'app=crm'
    pagerduty.com/service-id: PCIJWYX

spec:
  type: service
  lifecycle: production
  owner: user:guest
  system: crm-system
  providesApis:
    - crm-api
  dependsOn:
    - resource:default/crm-database
