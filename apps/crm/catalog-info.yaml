---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: crm-api
  title: CRM REST API
  description: REST API exposed by the CRM Spring Boot backend for clients, contacts, and opportunities.
  tags:
    - openapi
    - rest
    - spring-boot
spec:
  type: openapi
  lifecycle: production
  owner: user:guest
  system: crm-system
  definition: |
    openapi: 3.0.3

    info:
      title: CRM REST API
      version: 1.0.0
      description: REST API exposed by the CRM Spring Boot backend.

    servers:
      - url: http://crm.local/api
        description: CRM Ingress Gateway

    paths:

      /clients:
        get:
          summary: List all clients
          description: Retrieve all CRM clients.
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'

        post:
          summary: Create a client
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClientInput'
          responses:
            '201':
              description: Client created successfully
            '400':
              description: Invalid request

      /clients/{id}:
        get:
          summary: Get client by ID
          parameters:
            - name: id
              in: path
              required: true
              description: Client identifier
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: Client found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Client'
            '404':
              description: Client not found

        put:
          summary: Update client
          description: Update an existing CRM client.
          parameters:
            - name: id
              in: path
              required: true
              description: Client identifier
              schema:
                type: integer
                format: int64
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClientInput'
          responses:
            '200':
              description: Client updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Client'
            '404':
              description: Client not found

        delete:
          summary: Delete client
          description: Delete an existing CRM client.
          parameters:
            - name: id
              in: path
              required: true
              description: Client identifier
              schema:
                type: integer
                format: int64
          responses:
            '204':
              description: Client deleted successfully

      /contacts:
        get:
          summary: List all contacts
          description: Retrieve all CRM contacts.
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'

        post:
          summary: Create a contact
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContactInput'
          responses:
            '201':
              description: Contact created successfully
            '400':
              description: Invalid request

      /contacts/{id}:
        get:
          summary: Get contact by ID
          parameters:
            - name: id
              in: path
              required: true
              description: Contact identifier
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: Contact found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Contact'
            '404':
              description: Contact not found

        put:
          summary: Update contact
          description: Update an existing CRM contact.
          parameters:
            - name: id
              in: path
              required: true
              description: Contact identifier
              schema:
                type: integer
                format: int64
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ContactInput'
          responses:
            '200':
              description: Contact updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Contact'
            '404':
              description: Contact not found

        delete:
          summary: Delete contact
          description: Delete an existing CRM contact.
          parameters:
            - name: id
              in: path
              required: true
              description: Contact identifier
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: Contact deleted successfully

      /opportunites:
        get:
          summary: List all opportunities
          description: Retrieve all CRM opportunities.
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Opportunity'

        post:
          summary: Create an opportunity
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpportunityInput'
          responses:
            '201':
              description: Opportunity created successfully
            '400':
              description: Invalid request

      /opportunites/{id}:
        get:
          summary: Get opportunity by ID
          parameters:
            - name: id
              in: path
              required: true
              description: Opportunity identifier
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: Opportunity found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Opportunity'
            '404':
              description: Opportunity not found

        put:
          summary: Update opportunity
          description: Update an existing CRM opportunity.
          parameters:
            - name: id
              in: path
              required: true
              description: Opportunity identifier
              schema:
                type: integer
                format: int64
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/OpportunityInput'
          responses:
            '200':
              description: Opportunity updated successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Opportunity'
            '404':
              description: Opportunity not found

        delete:
          summary: Delete opportunity
          description: Delete an existing CRM opportunity.
          parameters:
            - name: id
              in: path
              required: true
              description: Opportunity identifier
              schema:
                type: integer
                format: int64
          responses:
            '200':
              description: Opportunity deleted successfully

    components:

      schemas:

        Client:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            name:
              type: string
              example: Nienow LLC
            phone:
              type: string
              example: "(305) 366-2029"
            company:
              type: string
              example: Waters, Cruickshank and Stanton

        ClientInput:
          type: object
          required:
            - name
            - phone
            - company
          properties:
            name:
              type: string
              example: Nienow LLC
            phone:
              type: string
              example: "(305) 366-2029"
            company:
              type: string
              example: Waters, Cruickshank and Stanton

        Contact:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            firstName:
              type: string
              example: Irving
            lastName:
              type: string
              example: Gottlieb
            email:
              type: string
              format: email
              example: ivory.carter@gmail.com
            phone:
              type: string
              example: "(505) 457-1534"
            client:
              $ref: '#/components/schemas/Client'

        ContactInput:
          type: object
          required:
            - firstName
            - lastName
            - email
            - phone
          properties:
            firstName:
              type: string
              example: Irving
            lastName:
              type: string
              example: Gottlieb
            email:
              type: string
              format: email
              example: ivory.carter@gmail.com
            phone:
              type: string
              example: "(505) 457-1534"
            clientId:
              type: integer
              format: int64
              example: 1

        Opportunity:
          type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            titre:
              type: string
              example: Awesome Plastic Plate
            montant:
              type: number
              format: double
              example: 20372.00
            statut:
              type: string
              example: GAGNEE
              enum:
                - PROSPECTION
                - NEGOCIATION
                - GAGNEE
                - PERDUE
            client:
              $ref: '#/components/schemas/Client'

        OpportunityInput:
          type: object
          required:
            - titre
            - montant
            - statut
            - clientId
          properties:
            titre:
              type: string
              example: Awesome Plastic Plate
            montant:
              type: number
              format: double
              example: 20372.00
            statut:
              type: string
              example: PROSPECTION
              enum:
                - PROSPECTION
                - NEGOCIATION
                - GAGNEE
                - PERDUE
            clientId:
              type: integer
              format: int64
              example: 1

