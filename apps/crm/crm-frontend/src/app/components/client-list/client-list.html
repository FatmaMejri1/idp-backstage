<div class="client-list-container">
  <div class="header-row">
    <h2>Liste des clients</h2>
    <a routerLink="/clients/new" class="btn-new">+ Nouveau client</a>
  </div>

  <p *ngIf="loading">Chargement en cours...</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <table *ngIf="!loading && clients.length > 0">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Téléphone</th>
        <th>Société</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let client of clients">
        <td>{{ client.name }}</td>
        <td>{{ client.phone }}</td>
        <td>{{ client.company }}</td>
        <td>
          <a [routerLink]="['/clients', client.id, 'edit']">Modifier</a>
          <button (click)="deleteClient(client.id)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && clients.length === 0">Aucun client trouvé.</p>
</div>
