<div class="form-container">
  <h2>{{ isEditMode ? 'Modifier le contact' : 'Nouveau contact' }}</h2>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="firstName">Prénom</label>
      <input id="firstName" type="text" formControlName="firstName" />
      <span class="error" *ngIf="contactForm.get('firstName')?.invalid && contactForm.get('firstName')?.touched">
        Le prénom est requis.
      </span>
    </div>

    <div class="form-group">
      <label for="lastName">Nom</label>
      <input id="lastName" type="text" formControlName="lastName" />
      <span class="error" *ngIf="contactForm.get('lastName')?.invalid && contactForm.get('lastName')?.touched">
        Le nom est requis.
      </span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <span class="error" *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
        Un email valide est requis.
      </span>
    </div>

    <div class="form-group">
      <label for="phone">Téléphone</label>
      <input id="phone" type="text" formControlName="phone" />
      <span class="error" *ngIf="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched">
        Le téléphone est requis.
      </span>
    </div>

    <div class="form-group">
      <label for="clientId">Client associé</label>
      <select id="clientId" formControlName="clientId">
        <option [ngValue]="null" disabled>-- Choisir un client --</option>
        <option *ngFor="let client of clients" [ngValue]="client.id">
          {{ client.name }} ({{ client.company }})
        </option>
      </select>
      <span class="error" *ngIf="contactForm.get('clientId')?.invalid && contactForm.get('clientId')?.touched">
        Un client doit être sélectionné.
      </span>
    </div>

    <button type="submit" [disabled]="contactForm.invalid">Enregistrer</button>
  </form>
</div>
